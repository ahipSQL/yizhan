<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>易占</title>
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="易占">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preload" href="fonts/wenkai-sub.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"LXGW WenKai TC";src:url(fonts/wenkai-sub.woff2) format("woff2");font-weight:400 700;font-display:swap}
/* VOICE: 靜、古、精確 — 一張印好的卦籤
   IDEA: 卦籤：墨黑卦畫、朱砂印、紙白；三種起卦法共用一張籤
   PICTURE: 本卦→互卦→之卦三卦大畫，動爻朱色；其下斷占
   COLOUR and TYPE: 紙白、墨黑、朱砂；霞鶩文楷 + 思源宋體
   LAYOUT: 墨色頂帶標題與三分頁，下接起卦面板、三卦、斷占、卦爻辭、紀錄 */
:root{color-scheme:light dark;--bg:light-dark(#fbfbf8,#121212);--ink:light-dark(#1a1a1a,#ecebe6);--mute:light-dark(#5d5d58,#a3a29b);--line:light-dark(#dcdbd4,#33332f);--card:light-dark(#ffffff,#1b1b1a);--zhu:light-dark(#b3261e,#e0574c);--band:light-dark(#1a1a1a,#050505);--bandink:#f3f2ec;--ok:light-dark(#2d6a3e,#7cc08e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU","Songti TC",serif;overflow-x:clip}
.kai{font-family:"LXGW WenKai TC","Kaiti TC","BiauKai",serif}
.band{padding:clamp(22px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
header.band{background:var(--band);color:var(--bandink);padding-bottom:0}
h1{font:700 clamp(36px,6vw,52px)/1.05 "LXGW WenKai TC",serif;margin:0 0 6px;letter-spacing:.2em}
.sub{color:#b9b8b0;margin:0 0 22px;font-size:15px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{font:inherit;font-size:16px;background:transparent;color:#cfcec6;border:0;border-bottom:3px solid transparent;padding:10px 16px;min-height:44px;cursor:pointer}
.tabs button[aria-selected=true]{color:#fff;border-color:var(--zhu)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
.panel{background:var(--card);border-bottom:1px solid var(--line)}
.form{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
.form label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
input[type=number],input[type=text],input[type=datetime-local]{font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-height:44px;width:8em}
input.wide{width:min(18em,80vw)}
.q input{width:min(26em,86vw)}
.chk{display:flex!important;align-items:center;gap:8px;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--zhu)}
.btn{font:inherit;font-size:17px;min-height:44px;padding:9px 22px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.zhu{background:var(--zhu);border-color:var(--zhu);color:#fff}
.hint{font-size:14px;color:var(--mute);margin:12px 0 0;max-width:70ch}
.err{color:var(--zhu)}
.calc{font-size:15px;color:var(--mute);margin:0 0 18px;line-height:1.8}
.calc b{color:var(--ink);font-weight:700}
/* 蓍草 */
.shi{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(16px,3vw,40px);margin-top:16px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
.dot.f{background:var(--ink);border-color:var(--ink)}.dot.c{background:var(--zhu);border-color:var(--zhu)}
.step{font:700 20px/1.3 "LXGW WenKai TC",serif;margin:4px 0}
.split{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:12px 0}
.rbox{font-size:18px;min-height:44px;min-width:6em;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:6px;padding:9px 12px}
.sres{font-size:15px;line-height:1.9;color:var(--mute)}
.sres b{color:var(--ink)}
.plines{list-style:none;margin:0;padding:0}
.plines li{display:grid;grid-template-columns:3em 140px 4em;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.plines .bar{height:12px;display:flex;justify-content:space-between}
.plines .bar i{display:block;height:100%;background:currentColor}
.plines .e{color:var(--line)}.plines .mv{color:var(--zhu)}
/* 結果 */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,28px);align-items:start}
.gua{text-align:center;position:relative}
.gua .role{font-size:14px;color:var(--mute);letter-spacing:.3em}
.gua svg{width:min(100%,190px);height:auto;display:block;margin:10px auto}
.gua .nm{font:700 clamp(22px,3.2vw,32px)/1.15 "LXGW WenKai TC",serif}
.gua .full{font-size:15px;color:var(--mute)}
.gua.main .nm{color:var(--zhu)}
.arrow{position:absolute;top:44%;right:calc(-1 * clamp(10px,2vw,28px));transform:translate(50%,-50%);color:var(--mute);font-size:18px}
.dong{margin:22px 0 0;text-align:center;font-size:18px}
.dong b{color:var(--zhu)}
.zhan{border-top:3px solid var(--zhu);border-bottom:1px solid var(--line);padding:20px 0 10px;margin-top:26px}
.zhan .rule{font-size:14px;color:var(--mute);margin:0 0 14px}
.zhan .it{margin:0 0 16px}
.zhan .ci{font:400 clamp(21px,2.6vw,27px)/1.6 "LXGW WenKai TC",serif;margin:0 0 8px;text-wrap:pretty}
.zhan .ci b{color:var(--zhu);font-weight:700;margin-right:.4em}
.zhan .zhu-tag{display:inline-block;border:2px solid var(--zhu);color:var(--zhu);font-size:13px;padding:0 5px;border-radius:3px;margin-right:8px;vertical-align:4px;font-family:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif}
.zhan .ky{font-size:17px;margin:0;max-width:72ch}
.zhan .ky span{color:var(--mute);font-size:14px;margin-right:.6em}
.zhan .xc{font:400 clamp(18px,2.1vw,21px)/1.6 "LXGW WenKai TC",serif;margin:12px 0 6px;padding-left:14px;border-left:2px solid var(--line)}
.zhan .xc+.ky{padding-left:16px}
.zhan .xl{font:13px "Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;color:var(--mute);margin-right:.6em}
.zhan .it{padding-bottom:6px}
.zhan .nt{font-size:14px;color:var(--mute);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,3vw,40px)}
h2{font:700 22px/1.2 "LXGW WenKai TC",serif;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--mute);font-size:14px}
.num td,.num th{text-align:right;font-variant-numeric:tabular-nums}
.num td:first-child,.num th:first-child,.num td:nth-child(2),.num th:nth-child(2){text-align:left}
.ji{color:var(--ok);white-space:nowrap}.xiong{color:var(--zhu);white-space:nowrap}
.yao{list-style:none;margin:0;padding:0}
.yao li{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.yao .p{font:700 16px/1.75 "LXGW WenKai TC",serif;color:var(--mute)}
.yao .x{font:17px/1.75 "LXGW WenKai TC",serif}
.yao li.on .p,.yao li.on .x{color:var(--zhu)}
.yao .k{grid-column:2;font-size:14px;color:var(--mute)}
.gc{font:18px/1.75 "LXGW WenKai TC",serif;margin:0 0 6px}
.gk{font-size:14px;color:var(--mute);margin:0 0 12px}
.sm{font-size:14px;color:var(--mute);margin:10px 0 2px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;border-bottom:1px solid var(--line);padding:10px 0}
.hist button{font:inherit;background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0;min-height:36px}
.hist .d{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.toast{font-size:14px;color:var(--ok);align-self:center}
.seal{display:inline-block;border:2px solid var(--zhu);color:var(--zhu);padding:1px 6px;border-radius:3px;font-size:13px;margin-left:6px;vertical-align:2px}
details{margin-top:22px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:16px}
.scroll{overflow-x:auto}
[hidden]{display:none!important}
@media(max-width:760px){.grid2,.shi{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.trio{gap:6px}.gua .full{font-size:13px}.arrow{display:none}.tabs button{padding:10px 10px}table{font-size:13px}td,th{padding:6px 4px}}
@media(prefers-reduced-motion:no-preference){.gua svg .ln{animation:rise .5s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="band">
 <div class="wrap">
  <h1>易占</h1>
  <p class="sub">三數起卦・蓍草演卦・時間起卦　斷占依朱熹《易學啟蒙・考變占》</p>
  <div class="tabs" role="tablist">
   <button role="tab" data-m="three" aria-selected="true">三數起卦</button>
   <button role="tab" data-m="shi" aria-selected="false">蓍草演卦</button>
   <button role="tab" data-m="time" aria-selected="false">時間起卦</button>
  </div>
 </div>
</header>

<section class="band panel">
 <div class="wrap">
  <label class="q form" style="display:grid;gap:4px;font-size:14px;color:var(--mute);margin-bottom:16px">所問之事（選填）<input type="text" id="q" placeholder="例：此行宜否"></label>

  <form id="f3" class="form" data-p="three" autocomplete="off">
   <label>第一數（上卦）<input type="number" id="a3" min="100" max="999" step="1" inputmode="numeric" value="327"></label>
   <label>第二數（下卦）<input type="number" id="b3" min="100" max="999" step="1" inputmode="numeric" value="516"></label>
   <label>第三數（動爻）<input type="number" id="c3" min="100" max="999" step="1" inputmode="numeric" value="209"></label>
   <button class="btn zhu" type="submit">起卦</button>
   <button class="btn ghost" type="button" id="rnd3">隨機三數</button>
  </form>

  <div data-p="shi" hidden>
   <p class="hint" style="margin:0">大衍之數五十，其用四十有九。每變：分二、掛一（自右手取一）、揲四、歸奇；三變成一爻，十八變成卦。輸入左手策數，右手自動計算。</p>
   <div class="shi">
    <div>
     <div class="dots" id="dots"></div>
     <p class="step" id="slbl"></p>
     <p class="sres" id="savail" style="margin:0"></p>
     <form id="fs" class="split" autocomplete="off">
      <label style="display:grid;gap:4px;font-size:14px;color:var(--mute)">左手蓍策<input type="number" id="Li" inputmode="numeric" min="1"></label>
      <div style="display:grid;gap:4px;font-size:14px;color:var(--mute)">右手（自動）<div class="rbox" id="Rd">—</div></div>
      <button class="btn zhu" type="submit" id="goBtn">演算</button>
     </form>
     <div class="row" style="margin-top:0">
      <button class="btn ghost" type="button" id="rndS">隨機分策一變</button>
      <button class="btn ghost" type="button" id="autoS">自動演完</button>
      <button class="btn ghost" type="button" id="rstS">重新演卦</button>
     </div>
     <p class="hint err" id="serr"></p>
     <div class="sres" id="sres"></div>
    </div>
    <div>
     <p class="sm" style="margin-top:0">爻象（上爻在上）</p>
     <ul class="plines" id="plines"></ul>
    </div>
   </div>
  </div>

  <form id="ft" class="form" data-p="time" hidden autocomplete="off">
   <label>時間<input type="datetime-local" id="dt" class="wide"></label>
   <label class="chk"><input type="checkbox" id="late" checked>23 時後作次日子時</label>
   <button class="btn zhu" type="submit">起卦</button>
   <button class="btn ghost" type="button" id="nowT">現在</button>
  </form>
  <p class="hint err" id="hint"></p>
 </div>
</section>

<section class="band">
 <div class="wrap">
  <p class="calc" id="calc"></p>
  <div class="trio" id="trio"></div>
  <p class="dong kai" id="dong"></p>
  <div class="zhan" id="zhan"></div>
  <details id="logw" hidden><summary>十八變演算紀錄</summary><div class="scroll" id="logbody"></div></details>
 </div>
</section>

<section class="band" style="padding-top:0">
 <div class="wrap grid2">
  <div>
   <h2 id="bt">本卦卦爻辭</h2>
   <p class="gc" id="gc"></p>
   <p class="gk" id="gk"></p>
   <ul class="yao" id="yao"></ul>
  </div>
  <div>
   <div id="tyw">
    <h2>體用生克</h2>
    <table id="ty"></table>
    <p class="hint">梅花易數以動爻所在之經卦為用，另一經卦為體；以用、互、之卦與體之五行生克斷吉凶。生體、比和為吉，克體為凶，體生用為洩氣，體克用為小吉。蓍草演卦不用此法。</p>
   </div>
   <h2 style="margin-top:26px">互卦・之卦卦辭</h2>
   <div id="ci"></div>
   <div class="row"><button class="btn ghost" type="button" id="copy">複製結果</button><span class="toast" id="toast"></span></div>
  </div>
 </div>
</section>

<section class="band" style="padding-top:0">
 <div class="wrap">
  <h2>起卦紀錄</h2>
  <ul class="hist" id="hist"></ul>
  <div class="row"><button class="btn ghost" type="button" id="clr">清除紀錄</button></div>
  <p class="hint">紀錄只存於本瀏覽器。</p>
 </div>
</section>

<script>
{
const TRI=[null,
 ['乾','天',[1,1,1],'金'],['兌','澤',[1,1,0],'金'],['離','火',[1,0,1],'火'],['震','雷',[1,0,0],'木'],
 ['巽','風',[0,1,1],'木'],['坎','水',[0,1,0],'水'],['艮','山',[0,0,1],'土'],['坤','地',[0,0,0],'土']];
const HEX=`乾,乾,乾,元亨利貞。|大為亨通，宜守正道；剛健進取，萬事可成。
坤,坤,坤,元亨，利牝馬之貞。君子有攸往，先迷後得主，利。西南得朋，東北喪朋。安貞吉。|大為亨通，宜像母馬一樣柔順守正；君子前往，搶先會迷失，隨後跟從則得其主而有利；往西南得朋友，往東北失朋友；安守正道則吉。
屯,坎,震,元亨利貞。勿用有攸往，利建侯。|大為亨通，宜守正；萬事起頭難，不宜急於前往，宜先建立根基、尋求輔佐。
蒙,艮,坎,亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。|亨通。不是我去求蒙昧者，而是蒙昧者來求我；初次來問就告訴他，一再追問便是褻瀆，褻瀆就不告訴他。宜守正。
需,坎,乾,有孚，光亨，貞吉。利涉大川。|心存誠信，光明亨通，守正吉；耐心等待時機，終能渡過大河、涉險成功。
訟,乾,坎,有孚窒惕，中吉，終凶。利見大人，不利涉大川。|有理卻受阻塞，要心存警惕；適可而止則吉，爭到底則凶；宜請大人裁斷，不宜冒大險。
師,坤,坎,貞，丈人吉，无咎。|用兵要守正，由老成持重的人統率則吉，沒有過失。
比,坎,坤,吉。原筮元永貞，无咎。不寧方來，後夫凶。|吉。再三審慎考察，具備善、恆、正之德，就沒有過失；不安的人會紛紛來歸，遲來者凶。
小畜,巽,乾,亨。密雲不雨，自我西郊。|亨通。濃雲密布卻不下雨，從西郊而來；積蓄尚小，時機未熟。
履,乾,兌,履虎尾，不咥人，亨。|踩到老虎尾巴，老虎卻不咬人，亨通；以和悅謹慎之心行走於險境。
泰,坤,乾,小往大來，吉亨。|小的去、大的來，天地相交，吉而亨通。
否,乾,坤,否之匪人，不利君子貞，大往小來。|閉塞不通，違背人道之常；不利君子守正，大的去、小的來。
同人,乾,離,同人于野，亨。利涉大川，利君子貞。|在曠野與人和同，亨通；宜涉越大河，宜君子守正。
大有,離,乾,元亨。|大為亨通；所有豐盛。
謙,坤,艮,亨，君子有終。|亨通；君子能謙，會有好結果。
豫,震,坤,利建侯行師。|安樂和順，宜建立諸侯、出兵行動。
隨,兌,震,元亨利貞，无咎。|大為亨通，宜守正，沒有過失；隨順時勢而行。
蠱,艮,巽,元亨，利涉大川。先甲三日，後甲三日。|大為亨通，宜涉越大河；在事變前後各三天審慎籌劃，整頓積弊。
臨,坤,兌,元亨利貞。至于八月有凶。|大為亨通，宜守正；但到了八月會有凶，盛時要防衰。
觀,巽,坤,盥而不薦，有孚顒若。|祭祀洗手後尚未獻祭，誠敬莊重令人仰望；以德示人，不在多言。
噬嗑,離,震,亨。利用獄。|亨通；宜運用刑獄，去除阻隔。
賁,艮,離,亨。小利有攸往。|亨通；稍有利於前往，文飾只宜小用。
剝,艮,坤,不利有攸往。|不宜前往；小人侵蝕正道之時，宜順勢而止。
復,坤,震,亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往。|亨通；出入沒有阻礙，朋友來而無過失；往返有其規律，七天就會回復，宜於前往。
无妄,乾,震,元亨利貞。其匪正有眚，不利有攸往。|大為亨通，宜守正；若不守正就有災禍，不宜前往。
大畜,艮,乾,利貞。不家食吉，利涉大川。|宜守正；不在家中自食則吉，宜涉越大河，出外有為。
頤,艮,震,貞吉。觀頤，自求口實。|守正則吉；觀察人如何養身養德，自己求取正當的口糧。
大過,兌,巽,棟撓，利有攸往，亨。|屋樑彎曲，宜於前往，亨通；非常之時要有非常作為。

離,離,離,利貞，亨。畜牝牛吉。|宜守正，亨通；像畜養母牛般柔順則吉。

遯,乾,艮,亨，小利貞。|亨通，小有利於守正；時勢不利，宜退避。
大壯,震,乾,利貞。|宜守正；強盛之時更要不失正道。
晉,離,坤,康侯用錫馬蕃庶，晝日三接。|安國之侯受賜眾多車馬，一日之內三次被接見；前進而受寵。

益,巽,震,利有攸往，利涉大川。|宜於前往，宜涉越大河；增益之時，大有可為。

姤,乾,巽,女壯，勿用取女。|女子強盛，不可娶此女；邂逅之時，要提防陰柔漸長。
萃,兌,坤,亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。|亨通；君王到宗廟祭祀，宜見大人，亨通，宜守正；用大牲祭祀吉，宜於前往。
升,坤,巽,元亨，用見大人，勿恤。南征吉。|大為亨通，宜見大人，不必憂慮；往南方前進吉。
困,兌,坎,亨，貞大人吉，无咎。有言不信。|亨通；守正的大人吉，沒有過失；但此時說話無人相信，宜少言多做。
井,坎,巽,改邑不改井，无喪无得。往來井井。汔至亦未繘井，羸其瓶，凶。|城邑可以遷改，水井不能遷改；不減不增，往來的人都汲用它；快汲到時繩子不夠長，或打破了水瓶，凶。
革,兌,離,巳日乃孚。元亨利貞，悔亡。|到了適當之日才能取信；大為亨通，宜守正，悔恨消失。
鼎,離,巽,元吉，亨。|大吉，亨通；去故取新，養賢有成。

艮,艮,艮,艮其背，不獲其身；行其庭，不見其人，无咎。|止於背後，不見其身；走在庭院中，不見其人；知止而不妄動，沒有過失。
漸,巽,艮,女歸吉，利貞。|女子出嫁吉，宜守正；循序漸進。
歸妹,震,兌,征凶，无攸利。|前往凶，無所利；處事不正，躁進必有不利。

兌,兌,兌,亨，利貞。|亨通，宜守正；以和悅待人。

const YAO=`潛龍勿用。|龍潛在深水，時機未到；宜韜光養晦，不要急著行動。
見龍在田，利見大人。|龍已出現在田野，才能開始顯露；宜去見有德望的貴人，求得提攜。
君子終日乾乾，夕惕若，厲无咎。|整天勤奮不懈，到晚上仍警惕反省；處境雖危，但不會出錯。
或躍在淵，无咎。|可以試著躍起，也可以退回深淵；看清時勢再進退，就沒有過失。
飛龍在天，利見大人。|龍飛上天，正值得位鼎盛；宜與賢人合作，大展抱負。
亢龍有悔。|龍飛得太高，盛極必衰，會有懊悔；要知道適可而止。

履霜，堅冰至。|腳下踩到薄霜，就知道堅冰快來了；事情已有徵兆，要及早防範。
直方大，不習无不利。|正直、端方、寬厚，順其自然去做，不必刻意經營也無往不利。
含章可貞，或從王事，无成有終。|才華含藏不外露，可以守正；若替上位者做事，不居功就能善終。
括囊，无咎无譽。|像紮緊袋口一樣謹言慎行；不會得到稱讚，但也不會惹禍。
黃裳，元吉。|穿著黃色下裳，象徵守中謙和、柔順在下；大吉。
龍戰于野，其血玄黃。|陰盛到極點而與陽相爭，兩敗俱傷；要避免硬碰硬。

磐桓，利居貞，利建侯。|起步時徘徊難進；宜安守正道，先打好根基、尋求輔佐。
屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。|處境艱難、進退徘徊；來的不是敵人而是求合者，但宜守正等待，時候久了才會成事。
即鹿无虞，惟入于林中，君子幾不如舍，往吝。|沒有嚮導就去追鹿，只會迷失在林中；君子見機應放棄，硬要前往會受困。
乘馬班如，求婚媾，往吉，无不利。|雖然徘徊，主動去尋求合作對象，前往吉利，無所不利。
屯其膏，小貞吉，大貞凶。|恩澤難以廣施；小事守正則吉，大事硬推則凶。
乘馬班如，泣血漣如。|徘徊無路可進，傷心到泣血；困境已到極點，要設法轉變。

發蒙，利用刑人，用說桎梏，以往吝。|啟蒙之初，宜立規矩加以約束，讓人擺脫錯誤；但一味嚴懲下去會有困窘。
包蒙吉，納婦吉，子克家。|能包容不懂事的人則吉，娶妻吉，好比兒子能承擔家業。
勿用取女，見金夫，不有躬，无攸利。|不要娶這女子，她見到有錢人就失了分寸；無所利。要慎選合作對象。
困蒙，吝。|困在無知之中、又遠離良師，會有困窘。
童蒙，吉。|像孩童一樣虛心求教，吉。
擊蒙，不利為寇，利禦寇。|嚴厲糾正無知；但不可過頭變成傷害，宜用來防範外患。

需于郊，利用恆，无咎。|在郊外等待，離險難還遠；能耐心持久，就沒有過失。
需于沙，小有言，終吉。|在沙灘等待，漸近險處；會有些口舌是非，最後吉。
需于泥，致寇至。|在泥地等待，已逼近險地，自己招來禍患；要格外謹慎。

需于酒食，貞吉。|以酒食從容等待，守正則吉。
入于穴，有不速之客三人來，敬之終吉。|陷入穴中，有三位不請自來的客人；恭敬相待，最後吉。

不永所事，小有言，終吉。|不把爭端拖長；雖有小口舌，最後吉。

訟，元吉。|由中正的人來裁斷爭訟，大吉。

師出以律，否臧凶。|出兵要有紀律，紀律不好就凶。

比之匪人。|親近了不該親近的人；要慎選交往對象。
外比之，貞吉。|向外親近賢明的人，守正則吉。
顯比，王用三驅，失前禽，邑人不誡，吉。|光明正大地親近人，像君王打獵網開一面、任前面的獵物離去，百姓不必戒備，吉。

牽復，吉。|與同伴相互牽引一起回歸，吉。
輿說輻，夫妻反目。|車輻脫落，夫妻反目；遇到小阻礙，關係失和。
有孚，血去惕出，无咎。|心存誠信，就能免去傷害、擺脫憂懼，沒有過失。
有孚攣如，富以其鄰。|以誠信聯結眾人，與鄰居共享富足。

素履，往无咎。|保持樸素本色向前走，沒有過失。

眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。|獨眼自以為看得清，跛腳自以為走得遠，踩到虎尾被咬，凶；好比武夫逞強要當君主。

无不利，撝謙。|無所不利，要把謙德發揮出來。

由豫，大有得，勿疑，朋盍簪。|大家因你而得安樂，大有收穫；不要猶疑，朋友會像髮簪束髮一樣聚攏過來。

冥豫，成有渝，无咎。|沉迷於享樂，但若能改變，就沒有過失。

官有渝，貞吉，出門交有功。|職守有變動，守正吉；出門與人交往會有成果。

係丈夫，失小子，隨有求得，利居貞。|依附君子，捨棄小人；追隨對了，有求必得，宜安守正道。
隨有獲，貞凶。有孚在道，以明，何咎？|追隨而有收穫，但堅持下去有凶；若心存誠信、走在正道、明白事理，又有什麼過錯？
孚于嘉，吉。|誠心信任美善之人，吉。
拘係之，乃從維之，王用亨于西山。|緊緊繫結相隨，君王在西山祭祀；心意牢固。

幹父之蠱，有子考无咎，厲終吉。|整頓父輩留下的弊端，有這樣的兒子，先人無過；雖有危險，最後吉。
幹母之蠱，不可貞。|整頓母輩的弊端，不可過於剛直。
幹父之蠱，小有悔，无大咎。|整頓父輩弊端，稍有懊悔，沒有大錯。
裕父之蠱，往見吝。|放任父輩的弊端不管，往後會見到困窘。
幹父之蠱，用譽。|整頓父輩弊端，獲得美譽。
不事王侯，高尚其事。|不去侍奉王侯，以高潔自守。

咸臨，貞吉。|以感應之心臨事待人，守正吉。
咸臨，吉无不利。|以感化臨人，吉，無所不利。
甘臨，无攸利。既憂之，无咎。|用甜言蜜語對待人，無所利；若能憂懼改正，就沒有過失。
至臨，无咎。|親自到場處理，沒有過失。
知臨，大君之宜，吉。|以智慧領導，是明君該做的，吉。
敦臨，吉无咎。|以敦厚待下，吉，沒有過失。

童觀，小人无咎，君子吝。|像孩童一樣見識淺；一般人無妨，君子則有困窘。
闚觀，利女貞。|從門縫偷看，見識有限；只適合守正自持。
觀我生，進退。|觀察自己的作為，再決定進退。
觀國之光，利用賓于王。|觀察國家的光明氣象，宜出仕、做君王的賓客。
觀我生，君子无咎。|反觀自己的作為，君子沒有過失。
觀其生，君子无咎。|觀察自身的言行，君子沒有過失。

屨校滅趾，无咎。|腳戴刑具蓋住腳趾，小懲大戒，沒有過失。
噬膚滅鼻，无咎。|咬軟肉咬到鼻子都沒進去，用力過猛，但沒有過失。
噬腊肉，遇毒，小吝，无咎。|啃乾肉遇到毒，小有困窘，沒有大錯。
噬乾胏，得金矢，利艱貞，吉。|啃帶骨的乾肉，咬到銅箭頭；宜在艱難中守正，吉。
噬乾肉，得黃金，貞厲，无咎。|啃乾肉得到黃金；守正雖有危險，沒有過失。
何校滅耳，凶。|肩扛木枷遮沒耳朵，罪大難解，凶。

賁其趾，舍車而徒。|裝飾腳趾，捨車步行；安守本分，不慕虛榮。
賁其須。|修飾鬍鬚；隨上位者而動。
賁如濡如，永貞吉。|裝飾得華美潤澤，長久守正則吉。
賁如皤如，白馬翰如，匪寇婚媾。|素白樸實，白馬飛奔而來；不是敵人，是來求合的。
賁于丘園，束帛戔戔，吝，終吉。|裝點田園，禮物微薄，看似寒酸，最後吉。
白賁，无咎。|以素白為飾，返璞歸真，沒有過失。

剝床以足，蔑貞凶。|床腳被剝蝕，正道受損，凶。
剝床以辨，蔑貞凶。|剝蝕到床板邊，正道受損，凶。
剝之，无咎。|在剝落之時能與小人劃清界線，沒有過失。
剝床以膚，凶。|剝到床面、切近肌膚，凶。
貫魚，以宮人寵，无不利。|像串魚一樣帶領眾人依序受寵，無所不利。
碩果不食，君子得輿，小人剝廬。|大果實留著沒被吃掉；君子得之如得車，小人得之則拆毀屋舍。

不遠復，无祗悔，元吉。|走不遠就回頭，不至於大悔，大吉。
休復，吉。|美好地回歸、親近仁者，吉。
頻復，厲无咎。|屢錯屢改，雖有危險，沒有過失。
中行獨復。|在眾人之中，獨自回到正道。
敦復，无悔。|誠懇敦厚地回歸，沒有悔恨。
迷復，凶，有災眚。用行師，終有大敗，以其國君凶，至于十年不克征。|迷路而不回頭，凶，有災禍；若用兵終將大敗，連累國君，十年都無法再出征。

无妄，往吉。|不妄為，前往吉。
不耕穫，不菑畬，則利有攸往。|不為了收穫才耕種，不為了熟田才開墾，順其自然，宜於前往。
无妄之災，或繫之牛，行人之得，邑人之災。|無端之災：有人拴著的牛被路人牽走，卻讓鄉里的人蒙冤受害。
可貞，无咎。|能堅守正道，沒有過失。
无妄之疾，勿藥有喜。|無端的病痛，不必用藥，自會好轉。
无妄，行有眚，无攸利。|雖無妄念，但時勢已盡，行動會有災，無所利。

有厲，利已。|有危險，宜停下來。
輿說輹。|車軸脫落，暫停不前。
良馬逐，利艱貞。曰閑輿衛，利有攸往。|良馬奔馳追逐，宜在艱難中守正；每天練習駕車與防衛，利於前往。
童牛之牿，元吉。|在小牛角上綁橫木，防患於未然，大吉。
豶豕之牙，吉。|閹過的豬，牙雖在也不傷人；從根本處制約，吉。
何天之衢，亨。|走在通天大道上，亨通。

舍爾靈龜，觀我朵頤，凶。|丟掉自己的寶物，羨慕別人大吃大喝，凶。
顛頤，拂經于丘頤，征凶。|反過來向下求養，違背常理；向高處求養，前往凶。
拂頤，貞凶，十年勿用，无攸利。|違背養身養德的正道，堅持則凶，十年都不可用，無所利。
顛頤吉，虎視眈眈，其欲逐逐，无咎。|向下求賢以養民，吉；像老虎專注凝視、追求不懈，沒有過失。
拂經，居貞吉，不可涉大川。|違反常規，安守正道則吉；不可冒大險。
由頤，厲吉，利涉大川。|大家倚賴他得養，知道責任重大則吉，宜涉越大河、承擔大事。

藉用白茅，无咎。|用潔白的茅草墊底，謹慎到極點，沒有過失。
枯楊生稊，老夫得其女妻，无不利。|枯楊長出新芽，老人娶得少妻；無所不利。
棟橈，凶。|屋樑彎曲，凶。
棟隆，吉，有它吝。|屋樑隆起，吉；但若另有牽掛，會有困窘。
枯楊生華，老婦得其士夫，无咎无譽。|枯楊開花，老婦嫁少夫；沒有過失，也沒有稱譽。
過涉滅頂，凶，无咎。|涉水過深淹過頭頂，凶；但其心志無可指責。

習坎，入于坎窞，凶。|險上加險，落入深坑，凶。
坎有險，求小得。|身處險中，只求小有所得。
來之坎坎，險且枕，入于坎窞，勿用。|進退都是險，又險又深，已落坑底；不要輕舉妄動。
樽酒簋貳，用缶，納約自牖，終无咎。|一樽酒、兩簋飯，用樸素瓦器，從窗口遞上誠意；最後沒有過失。
坎不盈，祗既平，无咎。|坑還沒填滿，但已快平了，沒有過失。
係用徽纆，寘于叢棘，三歲不得，凶。|被繩索捆綁，丟進荊棘叢，三年不得脫身，凶。

履錯然，敬之无咎。|腳步紛亂交錯，恭敬謹慎就沒有過失。
黃離，元吉。|中正柔和的黃色光明，大吉。
日昃之離，不鼓缶而歌，則大耋之嗟，凶。|夕陽西斜；不能擊缶而歌、安然自處，就會有衰老的嗟嘆，凶。
突如其來如，焚如，死如，棄如。|來勢突兀，像火燒起，隨即熄滅、被拋棄；來得太猛不被接納。
出涕沱若，戚嗟若，吉。|淚流滿面、憂戚嗟嘆；能憂懼，所以吉。
王用出征，有嘉折首，獲匪其醜，无咎。|君王出征，嘉獎斬除首惡，不追究脅從，沒有過失。

咸其拇。|感應在腳拇趾；動念尚淺。
咸其腓，凶，居吉。|感應在小腿，妄動則凶，安守則吉。
咸其股，執其隨，往吝。|感應在大腿，只想跟著別人動；前往有困窘。
貞吉悔亡，憧憧往來，朋從爾思。|守正吉，悔恨消失；若心意不定、思來想去，只有同類會跟從你的想法。
咸其脢，无悔。|感應在背脊，影響不大，但沒有悔恨。
咸其輔頰舌。|只用口舌言語去打動人。

浚恆，貞凶，无攸利。|一開始就要求深入持久，堅持則凶，無所利。
悔亡。|悔恨消失。
不恆其德，或承之羞，貞吝。|不能持守德行，可能蒙受羞辱，堅持下去有困窘。
田无禽。|打獵一無所獲；位置不對，久守也無功。
恆其德，貞，婦人吉，夫子凶。|持守柔順之德；適合順從者，吉；主事者若如此則凶。
振恆，凶。|浮躁不安，不能持久，凶。

遯尾，厲，勿用有攸往。|退避落在最後，危險，不要再前往。
執之用黃牛之革，莫之勝說。|用黃牛皮綁緊，誰也解不開；心意堅定。
係遯，有疾厲，畜臣妾吉。|有牽掛而退不了，有病有危；照顧好身邊的人則吉。
好遯，君子吉，小人否。|雖有所好仍能退，君子吉，小人做不到。
嘉遯，貞吉。|適時而得體地退避，守正吉。
肥遯，无不利。|從容寬裕地退隱，無所不利。

壯于趾，征凶，有孚。|強壯只在腳趾，冒進必凶。
貞吉。|守正吉。
小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。|小人逞強，君子不用；堅持有危險，像公羊撞籬笆，角被卡住。
貞吉悔亡，藩決不羸，壯于大輿之輹。|守正吉，悔恨消失；籬笆已破不再卡角，強健如大車的車軸。
喪羊于易，无悔。|在田界上丟了羊，沒有悔恨。
羝羊觸藩，不能退，不能遂，无攸利，艱則吉。|公羊撞籬笆，進退不得，無所利；知道艱難而自守，則吉。

晉如摧如，貞吉。罔孚，裕无咎。|想前進卻受挫，守正吉；還沒得到信任，從容寬裕就沒有過失。
晉如愁如，貞吉。受茲介福，于其王母。|前進而憂愁，守正吉；將從長輩處得到大福。
眾允，悔亡。|眾人信服，悔恨消失。
晉如鼫鼠，貞厲。|像鼫鼠一樣貪進，堅持有危險。
悔亡，失得勿恤，往吉无不利。|悔恨消失，不必在意得失，前往吉，無所不利。
晉其角，維用伐邑，厲吉无咎，貞吝。|進到角尖已無路，只能整頓自己的地方；知危則吉無過，堅持則有困窘。

明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。|光明受傷時飛行，垂著翅膀；君子離去，三天不吃飯，前往會遭人非議。
明夷，夷于左股，用拯馬壯，吉。|光明受傷，傷在左腿，用強壯的馬救助，吉。
明夷于南狩，得其大首，不可疾貞。|在南方狩獵，擒獲首惡；但不可操之過急。
入于左腹，獲明夷之心，于出門庭。|深入內部，看清昏暗者的心意，及早離開。
箕子之明夷，利貞。|像箕子一樣隱藏才智，宜守正。
不明晦，初登于天，後入于地。|不明而昏暗，起初高升上天，後來墜落入地。

閑有家，悔亡。|一開始就為家中立好規矩，悔恨消失。
无攸遂，在中饋，貞吉。|不擅作主張，把家中飲食照料好，守正吉。
家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。|治家嚴厲，雖有悔有危，但吉；放任嬉笑，最後有困窘。
富家，大吉。|使家庭富足，大吉。
王假有家，勿恤，吉。|君王以德感化家人，不必憂慮，吉。
有孚威如，終吉。|有誠信又有威嚴，最後吉。

悔亡，喪馬勿逐，自復；見惡人，无咎。|悔恨消失；馬走失不必追，自己會回來；見到惡人也沒有過失。
遇主于巷，无咎。|在小巷裡遇到主人，沒有過失。
見輿曳，其牛掣，其人天且劓，无初有終。|車被拖住，牛被牽制，人受刑傷；起初不順，最後有好結果。
睽孤，遇元夫，交孚，厲无咎。|乖離孤立，遇到好伙伴，以誠相交；雖有危險，沒有過失。
悔亡，厥宗噬膚，往何咎？|悔恨消失，同類相合如咬軟肉般容易，前往有什麼過錯？
睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。|孤立多疑，看到滿身泥的豬、一車鬼怪，先張弓後放下；原來不是敵人而是求合者，前往遇雨則吉。

往蹇，來譽。|前往遇難，回頭反得美譽。
王臣蹇蹇，匪躬之故。|臣子歷經重重艱難，不是為了自己。
往蹇，來反。|前往遇難，回返。
往蹇，來連。|前往遇難，回頭聯合眾人。
大蹇，朋來。|大難之中，朋友前來相助。
往蹇，來碩，吉，利見大人。|前往遇難，回頭大有收穫，吉，宜見大人。

无咎。|沒有過失。
田獲三狐，得黃矢，貞吉。|打獵得到三隻狐狸，獲得黃銅箭，守正吉。
負且乘，致寇至，貞吝。|背著東西又坐車，招來盜賊；堅持有困窘。
解而拇，朋至斯孚。|擺脫腳拇趾般的小人牽絆，朋友才會來信任你。
君子維有解，吉，有孚于小人。|君子能解除困難，吉；連小人也會信服退去。
公用射隼于高墉之上，獲之，无不利。|王公在高城上射鷹隼，一箭射中，無所不利。

已事遄往，无咎，酌損之。|事情辦完就趕快去幫忙，沒有過失，但要斟酌付出多少。
利貞，征凶，弗損益之。|宜守正，冒進則凶；不必損己也能益人。
三人行則損一人，一人行則得其友。|三人同行會少掉一人，一人獨行反而得到朋友。
損其疾，使遄有喜，无咎。|減少自己的毛病，讓好事快來，沒有過失。
或益之十朋之龜，弗克違，元吉。|有人送來價值極高的寶龜，推辭不掉，大吉。
弗損益之，无咎，貞吉，利有攸往，得臣无家。|不損己而益人，沒有過失，守正吉，利於前往；得到眾人歸心，不只一家。

利用為大作，元吉，无咎。|宜做大事，大吉，沒有過失。
或益之十朋之龜，弗克違，永貞吉。王用享于帝，吉。|有人送來寶龜，推辭不掉，長久守正則吉；君王祭祀上帝，吉。
益之用凶事，无咎。有孚中行，告公用圭。|在凶難之事中得益，沒有過失；心存誠信、行中道，持圭稟告王公。
中行，告公從，利用為依遷國。|行中道，稟告王公而被採納，宜作為依靠以遷移大事。
有孚惠心，勿問元吉。有孚惠我德。|真心施惠，不必問就是大吉；人們也真心感念我的德行。
莫益之，或擊之，立心勿恆，凶。|沒人幫他，反有人攻擊他；存心不恆，凶。

壯于前趾，往不勝為咎。|強壯只在前腳趾，貿然前往不能取勝，反成過錯。
惕號，莫夜有戎，勿恤。|警惕呼號，即使夜裡有敵來，也不必憂慮。
壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。|怒氣形於臉色，有凶；君子果決，獨行遇雨被淋濕而惱怒，但沒有過失。
臀无膚，其行次且。牽羊悔亡，聞言不信。|臀部無皮，坐立難安、行走困難；跟隨在後則悔恨消失，但聽了也不會相信。
莧陸夬夬，中行无咎。|像拔除野草一樣果決，行中道則沒有過失。
无號，終有凶。|呼號也沒有用，最後有凶。

繫于金柅，貞吉，有攸往，見凶，羸豕孚蹢躅。|繫在堅固的車閘上，守正吉；若前往則見凶，像瘦豬一樣躁動不安。
包有魚，无咎，不利賓。|廚中有魚，沒有過失，但不宜給外人。
臀无膚，其行次且，厲，无大咎。|臀部無皮，行走困難，有危險，但沒有大錯。
包无魚，起凶。|廚中無魚，起而爭奪則凶。
以杞包瓜，含章，有隕自天。|用杞葉包瓜，內含美德，好事自天而降。
姤其角，吝，无咎。|在角尖上相遇，有困窘，但沒有過失。

有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往无咎。|誠信不能堅持到底，心亂而亂聚；若呼喚求助，一握手便破涕為笑，不必憂慮，前往沒有過失。
引吉，无咎，孚乃利用禴。|被牽引而聚則吉，沒有過失；心誠則簡樸的祭祀也可以。
萃如嗟如，无攸利，往无咎，小吝。|想聚合卻嘆氣，無所利；前往沒有過失，稍有困窘。
大吉，无咎。|要大吉才能沒有過失。
萃有位，无咎。匪孚，元永貞，悔亡。|聚眾時居於正位，沒有過失；若有人不服，宜修德、長久守正，悔恨消失。
齎咨涕洟，无咎。|嘆息流淚，沒有過失。

允升，大吉。|被信任而上升，大吉。
孚乃利用禴，无咎。|心誠則簡樸的祭祀也可以，沒有過失。
升虛邑。|上升如進入無人之城，暢通無阻。
王用亨于岐山，吉无咎。|君王在岐山祭祀，吉，沒有過失。
貞吉，升階。|守正吉，步步高升。
冥升，利于不息之貞。|一味往上升而不知止，宜轉為不懈地守正。

臀困于株木，入于幽谷，三歲不覿。|坐困在樹樁上，陷入幽谷，三年不見人。
困于酒食，朱紱方來，利用亨祀，征凶，无咎。|困於酒食應酬，高位厚祿將到；宜誠心祭祀，冒進則凶，沒有過失。
困于石，據于蒺藜，入于其宮，不見其妻，凶。|被石頭困住，倚靠在蒺藜上，回到家中又不見妻子，凶。
來徐徐，困于金車，吝，有終。|來得遲緩，被金車所困；有困窘，但有好結果。
劓刖，困于赤紱，乃徐有說，利用祭祀。|割鼻斷足般受困於高位者；慢慢會有轉機與喜悅，宜誠心祭祀。
困于葛藟，于臲卼，曰動悔。有悔，征吉。|被葛藤纏住，處境搖晃不安，自認一動就後悔；若能悔悟，前往吉。

井泥不食，舊井无禽。|井底淤泥不能吃，舊井連鳥都不來。
井谷射鮒，甕敝漏。|井底的水只夠養小魚，汲水的甕又破漏。
井渫不食，為我心惻。可用汲，王明，並受其福。|井已淘淨卻沒人飲用，令人心傷；這水可以汲取，若君王英明，大家都能受福。
井甃，无咎。|修砌井壁，沒有過失。
井洌，寒泉食。|井水清冽，寒泉可飲。
井收勿幕，有孚元吉。|井水汲上來不加蓋，與人共享，有誠信，大吉。

鞏用黃牛之革。|用黃牛皮綁牢；時機未到，不可變革。
巳日乃革之，征吉，无咎。|時機成熟才變革，前往吉，沒有過失。
征凶，貞厲，革言三就，有孚。|冒進則凶，堅持有危險；變革的主張要再三商議成熟，才能取信。
悔亡，有孚改命，吉。|悔恨消失，以誠信改變局面，吉。
大人虎變，未占有孚。|大人像虎紋一樣煥然一新，不用占卜就已取信於人。
君子豹變，小人革面，征凶，居貞吉。|君子像豹紋般轉變，小人也改了面貌；此時再進則凶，安居守正則吉。

鼎顛趾，利出否，得妾以其子，无咎。|鼎倒過來腳朝上，正好倒出污物；如得妾而生子，沒有過失。
鼎有實，我仇有疾，不我能即，吉。|鼎中有實物；對頭有病，不能接近我，吉。
鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。|鼎耳變形，搬不動，美味吃不到；等到下雨，悔恨減少，最後吉。
鼎折足，覆公餗，其形渥，凶。|鼎腳折斷，打翻了王公的美食，弄得一身狼藉，凶。
鼎黃耳金鉉，利貞。|鼎配黃耳金鉉，宜守正。
鼎玉鉉，大吉，无不利。|鼎配玉鉉，大吉，無所不利。

震來虩虩，後笑言啞啞，吉。|雷聲驚來，心生恐懼；之後談笑自若，吉。
震來厲，億喪貝，躋于九陵，勿逐，七日得。|雷來危險，恐怕損失財物；登高避開，不必追尋，七日自會得回。
震蘇蘇，震行无眚。|受驚而惶惶不安；因戒懼而行動，就沒有災禍。
震遂泥。|受震後陷入泥淖，振作不起來。
震往來厲，億无喪，有事。|震動往來都有危險，但不會有損失，能保住所做的事。
震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎，婚媾有言。|驚得發抖、目光惶惑，前往凶；震動還沒到自己、只到鄰人，事先戒備就沒有過失，但親事會有口舌。

艮其趾，无咎，利永貞。|在起步時就止住，沒有過失，宜長久守正。
艮其腓，不拯其隨，其心不快。|止住小腿，卻救不了所跟隨的人，心中不快。
艮其限，列其夤，厲薰心。|硬止在腰部，脊肉撕裂，危險令人焦心。
艮其身，无咎。|能止住自身，沒有過失。
艮其輔，言有序，悔亡。|管住嘴巴，說話有條理，悔恨消失。
敦艮，吉。|敦厚地知止，吉。

鴻漸于干，小子厲，有言，无咎。|鴻雁漸進到水邊；年輕人有危險、有口舌，但沒有過失。
鴻漸于磐，飲食衎衎，吉。|鴻雁漸進到大石上，飲食和樂，吉。
鴻漸于陸，夫征不復，婦孕不育，凶，利禦寇。|鴻雁漸進到陸地；丈夫出征不回，婦人懷孕不能養育，凶；宜防禦外患。
鴻漸于木，或得其桷，无咎。|鴻雁漸進到樹上，或許找到平直的枝椏棲身，沒有過失。
鴻漸于陵，婦三歲不孕，終莫之勝，吉。|鴻雁漸進到山陵，婦人三年不孕；但最終誰也阻擋不了，吉。
鴻漸于陸，其羽可用為儀，吉。|鴻雁漸進到高處，羽毛可作為儀飾，吉。

歸妹以娣，跛能履，征吉。|出嫁時作為陪嫁，像跛腳也能走路；前往吉。
眇能視，利幽人之貞。|獨眼也能看，宜如幽靜之人般守正。
歸妹以須，反歸以娣。|待嫁而等候，回頭以陪嫁身分出嫁。
歸妹愆期，遲歸有時。|延誤了婚期，晚嫁自有時機。
帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。|帝乙嫁妹，正室衣袖不如陪嫁者華美；如月將圓而不盈，吉。
女承筐无實，士刲羊无血，无攸利。|女子捧筐空無一物，男子殺羊不見血；徒有形式，無所利。

遇其配主，雖旬无咎，往有尚。|遇到相匹配的主人，即使相處十日也沒有過失，前往受人尊崇。
豐其蔀，日中見斗，往得疑疾，有孚發若，吉。|遮蔽重重，正午卻見北斗；前往會被猜疑，以誠信去感發對方，吉。
豐其沛，日中見沬，折其右肱，无咎。|遮蔽更厚，正午見小星；折斷右臂，無法作為，但沒有過失。
豐其蔀，日中見斗，遇其夷主，吉。|遮蔽重重，正午見北斗；遇到相當的主人，吉。
來章，有慶譽，吉。|招來賢才，有福慶與美譽，吉。
豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。|房子蓋得高大，家中卻遮蔽陰暗，從門縫看寂靜無人，三年不見，凶。

旅瑣瑣，斯其所取災。|旅途中瑣碎計較，這是自取其災。
旅即次，懷其資，得童僕貞。|旅途中住進客舍，身懷錢財，得到忠實的僮僕。
旅焚其次，喪其童僕，貞厲。|旅途中客舍被燒，失去僮僕，堅持有危險。
旅于處，得其資斧，我心不快。|旅途中暫有棲身處，得到錢財與工具，但心中不快。
射雉，一矢亡，終以譽命。|射野雞，損失一支箭，最後得到美譽與爵命。
鳥焚其巢，旅人先笑後號咷，喪牛于易，凶。|鳥巢被燒，旅人先笑後哭，在田界丟了牛，凶。

進退，利武人之貞。|進退猶豫不定，宜像武人一樣果斷守正。
巽在床下，用史巫紛若，吉无咎。|謙卑到伏在床下，像史巫般盡力表達誠意，吉，沒有過失。
頻巽，吝。|一再勉強順從，有困窘。
悔亡，田獲三品。|悔恨消失，打獵收穫豐富。
貞吉悔亡，无不利，无初有終。先庚三日，後庚三日，吉。|守正吉，悔恨消失，無所不利；起初不順而終有好結果；變更前後審慎周詳，吉。
巽在床下，喪其資斧，貞凶。|謙卑過頭伏在床下，失去錢財與工具，堅持則凶。

和兌，吉。|平和地喜悅，吉。
孚兌，吉，悔亡。|以誠信待人而喜悅，吉，悔恨消失。
來兌，凶。|主動湊上來討好求悅，凶。
商兌未寧，介疾有喜。|斟酌該取悅誰而心不安；堅決遠離邪佞，就有喜事。
孚于剝，有厲。|信任會侵害你的小人，有危險。
引兌。|引誘別人來求悅。

用拯馬壯，吉。|用強壯的馬去救助，吉。
渙奔其机，悔亡。|離散之時奔向可依靠之處，悔恨消失。
渙其躬，无悔。|散去自身私心，沒有悔恨。
渙其群，元吉。渙有丘，匪夷所思。|解散私黨，大吉；散而又聚成山丘，非常人所能想到。
渙汗其大號，渙王居，无咎。|像出汗一樣發布號令，散發王者的積蓄，沒有過失。
渙其血，去逖出，无咎。|散去傷害，遠離憂患，沒有過失。

不出戶庭，无咎。|不出家門庭院，沒有過失。
不出門庭，凶。|該出門時不出門，錯失時機，凶。
不節若，則嗟若，无咎。|不知節制，就會嘆息；自作自受，怨不得人。
安節，亨。|安於節制，亨通。
甘節，吉，往有尚。|甘於節制，吉，前往受人尊崇。
苦節，貞凶，悔亡。|節制過度而苦，堅持則凶；能悔改則悔恨消失。

虞吉，有它不燕。|安守本分則吉，另有他求就不安。
鳴鶴在陰，其子和之。我有好爵，吾與爾靡之。|鶴在樹蔭下鳴叫，小鶴應和；我有好酒，願與你共飲。
得敵，或鼓或罷，或泣或歌。|遇到對手，時而擊鼓時而停下，時而哭泣時而唱歌；心無定見。
月幾望，馬匹亡，无咎。|月將圓滿，與同伴斷絕往來，沒有過失。
有孚攣如，无咎。|以誠信聯結人心，沒有過失。
翰音登于天，貞凶。|雞鳴想飛上天，名過其實，堅持則凶。

飛鳥以凶。|飛鳥逆勢往上飛，因此凶。
過其祖，遇其妣；不及其君，遇其臣，无咎。|越過祖父，遇見祖母；不到君主，遇見臣子；恰如其分，沒有過失。
弗過防之，從或戕之，凶。|不肯多加防範，放任下去可能受害，凶。
无咎，弗過遇之。往厲必戒，勿用永貞。|沒有過失，不過分而恰好相遇；前往有危險，必須警戒，不可固執。
密雲不雨，自我西郊，公弋取彼在穴。|密雲不雨，從西郊而來；王公用繫繩的箭射取穴中之物。
弗遇過之，飛鳥離之，凶，是謂災眚。|不遇而過頭，像飛鳥飛太高而落網，凶，這就是災禍。

曳其輪，濡其尾，无咎。|拖住車輪，沾濕尾巴，謹慎緩行，沒有過失。
婦喪其茀，勿逐，七日得。|婦人遺失車簾，不必追尋，七日自會得回。
高宗伐鬼方，三年克之，小人勿用。|殷高宗討伐鬼方，三年才取勝；小人不可用。
繻有衣袽，終日戒。|華服將破，備好破布以防漏，整天戒備。
東鄰殺牛，不如西鄰之禴祭，實受其福。|東鄰殺牛盛祭，不如西鄰簡樸誠心的祭祀，實實在在得福。
濡其首，厲。|沾濕了頭，危險。

濡其尾，吝。|沾濕尾巴，有困窘。
曳其輪，貞吉。|拖住車輪不冒進，守正吉。
未濟，征凶，利涉大川。|尚未成功，冒進則凶；宜準備好再涉越大河。
貞吉悔亡，震用伐鬼方，三年有賞于大國。|守正吉，悔恨消失；奮力討伐鬼方，三年後受大國封賞。
貞吉无悔，君子之光，有孚，吉。|守正吉，沒有悔恨，有君子的光輝，有誠信，吉。
有孚于飲酒，无咎；濡其首，有孚失是。|心懷信心飲酒，沒有過失；但沉溺到沾濕了頭，就失了分寸。`.split(/\n\s*\n/).map(b=>b.trim().split('\n').map(l=>{const[t,k]=l.split('|');return{t,k}}));
const DX=`天行健，君子以自強不息。|天道運行剛健不止，君子效法它，自我奮發，永不停息。
地勢坤，君子以厚德載物。|大地的形勢柔順寬厚，君子效法它，以深厚的德行承載萬物。
雲雷，屯；君子以經綸。|雲雷交動是屯，君子效法它，籌劃治理、開創事業。
山下出泉，蒙；君子以果行育德。|山下流出泉水是蒙，君子效法它，以果決的行動培養德行。
雲上於天，需；君子以飲食宴樂。|雲升到天上等待降雨是需，君子效法它，飲食宴樂、從容等待。
天與水違行，訟；君子以作事謀始。|天向上、水向下，背道而行是訟，君子效法它，做事在開頭就周密謀劃。
地中有水，師；君子以容民畜眾。|地中蘊藏水是師，君子效法它，包容百姓、蓄養群眾。
地上有水，比；先王以建萬國，親諸侯。|地上有水，彼此親附是比，先王效法它，分封萬國、親近諸侯。
風行天上，小畜；君子以懿文德。|風行於天上是小畜，君子效法它，修美文明德行。
上天下澤，履；君子以辯上下，定民志。|上為天、下為澤是履，君子效法它，分辨上下名分，安定民心。
天地交，泰；后以財成天地之道，輔相天地之宜，以左右民。|天地相交是泰，君王效法它，裁成天地之道、輔助天地所宜，以扶助百姓。
天地不交，否；君子以儉德辟難，不可榮以祿。|天地不交是否，君子效法它，收斂才德以避禍難，不可貪求榮祿。
天與火，同人；君子以類族辨物。|天與火同向上是同人，君子效法它，分類族群、辨別事物。
火在天上，大有；君子以遏惡揚善，順天休命。|火在天上照耀萬物是大有，君子效法它，遏止邪惡、表揚善行，順應天命。
地中有山，謙；君子以裒多益寡，稱物平施。|地中藏山是謙，君子效法它，減多補少，衡量事物而公平施予。
雷出地奮，豫；先王以作樂崇德，殷薦之上帝，以配祖考。|雷出地上震動萬物是豫，先王效法它，制作音樂、崇尚德行，隆重祭獻上帝並配祀祖先。
澤中有雷，隨；君子以嚮晦入宴息。|澤中有雷是隨，君子效法它，天黑就入室休息。
山下有風，蠱；君子以振民育德。|山下有風是蠱，君子效法它，振奮百姓、培育德行。
澤上有地，臨；君子以教思无窮，容保民无疆。|澤上有地是臨，君子效法它，教化之心無窮，包容保護百姓無邊。

大君之宜，行中之謂也。|明君所宜，是說行中道。
敦臨之吉，志在內也。|敦厚臨人之吉，志在內部。

初六童觀，小人道也。|初六童觀，是小人之道。
闚觀女貞，亦可醜也。|窺看而守女子之貞，對君子來說也可羞。
觀我生進退，未失道也。|觀察自身以定進退，未失正道。
觀國之光，尚賓也。|觀國之光，是崇尚為賓、出仕。
觀我生，觀民也。|觀察自身，即觀察百姓。
觀其生，志未平也。|觀察自身作為，心志尚未安平。

屨校滅趾，不行也。|腳戴刑具，就不再妄行。
噬膚滅鼻，乘剛也。|咬肉沒鼻，因凌駕陽剛。
遇毒，位不當也。|遇毒，因位不當。
利艱貞吉，未光也。|宜艱難守正吉，因尚未光大。
貞厲无咎，得當也。|守正有危無過，因處置得當。
何校滅耳，聰不明也。|枷鎖遮耳，因聽而不明。

舍車而徒，義弗乘也。|捨車步行，義理上不應乘車。
賁其須，與上興也。|修飾鬍鬚，隨上位者而動。
永貞之吉，終莫之陵也。|長久守正之吉，終究無人能欺凌。
六四當位疑也。匪寇婚媾，終无尤也。|六四所處之位令人疑懼；非寇而是婚媾，終無怨尤。
六五之吉，有喜也。|六五之吉，有喜慶。
白賁无咎，上得志也。|素白無過，在上而得志。

剝床以足，以滅下也。|剝床腳，是先毀滅下方根基。
剝床以辨，未有與也。|剝及床幹，因沒有應援。
剝之无咎，失上下也。|剝時無過，因脫離上下群陰。
剝床以膚，切近災也。|剝及床面，已切近災禍。
以宮人寵，終无尤也。|率宮人受寵，終無怨尤。
君子得輿，民所載也。小人剝廬，終不可用也。|君子得車，為百姓所擁戴；小人剝屋，終究不可用。

不遠之復，以修身也。|不遠即回，是用以修身。
休復之吉，以下仁也。|美好回歸之吉，因能親近仁者。
頻復之厲，義无咎也。|屢次回歸之危，按理無過。
中行獨復，以從道也。|中行獨返，是為了遵從正道。
敦復无悔，中以自考也。|敦厚回歸無悔，因居中自我省察。
迷復之凶，反君道也。|迷而不返之凶，因違反君道。

无妄之往，得志也。|不妄而往，必能得志。
不耕穫，未富也。|不為收穫而耕，不是為了致富。
行人得牛，邑人災也。|路人得牛，鄉人遭災。
可貞无咎，固有之也。|能守正無過，因本來就固有。
无妄之藥，不可試也。|無妄之疾的藥，不可輕試。
无妄之行，窮之災也。|無妄而行有災，因時窮而有災。

有厲利已，不犯災也。|有危宜止，不去觸犯災禍。
輿說輹，中无尤也。|車軸脫落，居中而無怨尤。
利有攸往，上合志也。|利於前往，因與上位者志同。
六四元吉，有喜也。|六四大吉，有喜慶。
六五之吉，有慶也。|六五之吉，有福慶。
何天之衢，道大行也。|如行通天大道，其道大為通行。

觀我朵頤，亦不足貴也。|羨看他人進食，也不足為貴。
六二征凶，行失類也。|六二前往凶，因行動失去同類。
十年勿用，道大悖也。|十年不可用，因大大違背正道。
顛頤之吉，上施光也。|向下求養之吉，因在上者施予光明。
居貞之吉，順以從上也。|安守正道之吉，因順從在上者。
由頤厲吉，大有慶也。|天下賴以得養、知危則吉，大有福慶。

藉用白茅，柔在下也。|用白茅墊底，是柔順居下。
老夫女妻，過以相與也。|老夫少妻，是超過常規而相與。
棟橈之凶，不可以有輔也。|棟樑彎曲之凶，無法得到輔助。
棟隆之吉，不橈乎下也。|棟樑隆起之吉，不向下彎曲。
枯楊生華，何可久也。老婦士夫，亦可醜也。|枯楊開花，怎能長久？老婦嫁少夫，也可羞。
過涉之凶，不可咎也。|涉水過深之凶，不可歸咎於他。

習坎入坎，失道凶也。|重險而陷入坑中，失去正道而凶。
求小得，未出中也。|求小有所得，尚未脫離險中。
來之坎坎，終无功也。|來去皆險，終究無功。
樽酒簋貳，剛柔際也。|樽酒簋貳，是剛柔相交之際。
坎不盈，中未大也。|坑未填滿，因中德尚未光大。
上六失道，凶三歲也。|上六失去正道，凶達三年。

履錯之敬，以辟咎也。|步履紛錯而能恭敬，是用以避免過失。
黃離元吉，得中道也。|黃色光明大吉，因得中道。
日昃之離，何可久也。|夕陽之光，怎能長久？
突如其來如，无所容也。|突然而來，無處容身。
六五之吉，離王公也。|六五之吉，因附麗於王公之位。
王用出征，以正邦也。|君王出征，是為了端正邦國。

咸其拇，志在外也。|感應在腳趾，志向在外。
雖凶居吉，順不害也。|雖凶但安居則吉，順從就不受害。
咸其股，亦不處也。志在隨人，所執下也。|感應在大腿，也不能安處；志在隨人，所執守的太卑下。
貞吉悔亡，未感害也。憧憧往來，未光大也。|守正吉悔亡，未受私感之害；心意往來不定，未能光大。
咸其脢，志末也。|感應在背脊，志向淺末。
咸其輔頰舌，滕口說也。|感應在口舌，只是張口說話。

浚恆之凶，始求深也。|深求恆久之凶，因一開始就要求太深。
九二悔亡，能久中也。|九二悔亡，因能長久守中。
不恆其德，无所容也。|不能恆守其德，無處容身。
久非其位，安得禽也。|長久處在不當之位，怎能得到獵物？
婦人貞吉，從一而終也。夫子制義，從婦凶也。|婦人守正吉，因從一而終；男子要裁斷事理，順從如婦人則凶。
振恆在上，大无功也。|躁動而居上位，完全無功。

遯尾之厲，不往何災也。|退避落後之危，不前往又有何災？
執用黃牛，固志也。|用黃牛皮綁牢，是堅定心志。
係遯之厲，有疾憊也。畜臣妾吉，不可大事也。|有牽繫而退之危，因有疾而疲憊；畜養僕從則吉，但不可做大事。
君子好遯，小人否也。|君子能好而退，小人不能。
嘉遯貞吉，以正志也。|美好退避守正吉，因心志端正。
肥遯无不利，无所疑也。|從容退隱無不利，因無所疑慮。

壯于趾，其孚窮也。|強壯在腳趾，必然窮困。
九二貞吉，以中也。|九二守正吉，因為居中。
小人用壯，君子罔也。|小人逞強，君子則不用。
藩決不羸，尚往也。|籬笆已破不困，宜於前往。
喪羊于易，位不當也。|在田界失羊，因位不當。
不能退，不能遂，不詳也。艱則吉，咎不長也。|進退不得，是考慮不周詳；知艱則吉，過失不會長久。

晉如摧如，獨行正也。裕无咎，未受命也。|欲進受阻，獨自行正道；寬裕無過，因尚未受命。
受茲介福，以中正也。|受此大福，因為中正。
眾允之，志上行也。|眾人信服，志在向上進取。
鼫鼠貞厲，位不當也。|如鼫鼠守此有危，因位不當。
失得勿恤，往有慶也。|不憂得失，前往有福慶。
維用伐邑，道未光也。|只能征伐己邑，因其道未光大。

君子于行，義不食也。|君子出走，按道義不食其祿。
六二之吉，順以則也。|六二之吉，因柔順而合法則。
南狩之志，乃大得也。|南狩的志向，終能大有所得。
入于左腹，獲心意也。|深入左腹，得知其心意。
箕子之貞，明不可息也。|箕子守正，光明不可熄滅。
初登于天，照四國也。後入于地，失則也。|起初升天，照耀四方；後來入地，因失去法則。

閑有家，志未變也。|防閑於家，趁心志尚未改變。
六二之吉，順以巽也。|六二之吉，因柔順謙遜。
家人嗃嗃，未失也。婦子嘻嘻，失家節也。|治家嚴厲，未失家道；婦子嬉笑，失去家中節度。
富家大吉，順在位也。|富家大吉，因柔順而居正位。
王假有家，交相愛也。|君王感化其家，彼此相愛。
威如之吉，反身之謂也。|威嚴之吉，是說反求諸己。

見惡人，以辟咎也。|見惡人，是用以避免過失。
遇主于巷，未失道也。|巷中遇主，未失正道。
見輿曳，位不當也。无初有終，遇剛也。|見車被拖，因位不當；起初不順終有結果，因遇到陽剛相應。
交孚无咎，志行也。|以誠相交無過，志向得以實行。
厥宗噬膚，往有慶也。|同宗易合，前往有福慶。
遇雨之吉，群疑亡也。|遇雨之吉，種種疑慮都消失。

往蹇來譽，宜待也。|往難來譽，宜於等待。
王臣蹇蹇，終无尤也。|臣子歷險，終無怨尤。
往蹇來反，內喜之也。|往難而返，內部的人歡喜。
往蹇來連，當位實也。|往難而聯合眾人，因處位正當且實在。
大蹇朋來，以中節也。|大難朋來，因守中而有節度。
往蹇來碩，志在內也。利見大人，以從貴也。|往難而來大得，志在內部；宜見大人，是追隨尊貴者。

剛柔之際，義无咎也。|剛柔相交之際，按理無過。
九二貞吉，得中道也。|九二守正吉，因得中道。
負且乘，亦可醜也。自我致戎，又誰咎也。|背負又乘車，也可羞；自己招來兵戎，又能怪誰？
解而拇，未當位也。|要擺脫拇趾之累，因位不當。
君子有解，小人退也。|君子解難，小人自然退去。
公用射隼，以解悖也。|王公射隼，是為了解除悖逆。

已事遄往，尚合志也。|事畢速往，是與上位者志合。
九二利貞，中以為志也。|九二宜守正，以守中為志向。
一人行，三則疑也。|一人行得友，三人則生猜疑。
損其疾，亦可喜也。|減損毛病，也是可喜之事。
六五元吉，自上祐也。|六五大吉，得自上天保佑。
弗損益之，大得志也。|不損而益人，大得其志。

元吉无咎，下不厚事也。|在下者本不宜擔重任，必須大吉才能無過。
或益之，自外來也。|有人增益他，是從外而來。
益用凶事，固有之也。|在凶事中得益，是本來應有的。
告公從，以益志也。|稟告王公被聽從，是以增益天下為志。
有孚惠心，勿問之矣。惠我德，大得志也。|誠心施惠，不必再問；人感我德，大得其志。
莫益之，偏辭也。或擊之，自外來也。|無人增益他，是偏頗之辭；有人攻擊他，是從外而來。

不勝而往，咎也。|不能取勝而前往，是過錯。
有戎勿恤，得中道也。|有敵來不必憂慮，因得中道。
君子夬夬，終无咎也。|君子果決，終無過失。
其行次且，位不當也。聞言不信，聰不明也。|行走困難，因位不當；聽了不信，因聽而不明。
中行无咎，中未光也。|行中道無過，但中德尚未光大。
无號之凶，終不可長也。|呼號也無用之凶，終究不能長久。

繫于金柅，柔道牽也。|繫於金柅，因陰柔之道要牽制。
包有魚，義不及賓也。|廚中有魚，按理不及賓客。
其行次且，行未牽也。|行走困難，但行動未受牽制。
无魚之凶，遠民也。|無魚之凶，因遠離百姓。
九五含章，中正也。有隕自天，志不舍命也。|九五內含美德，因中正；福自天降，因心志不違天命。
姤其角，上窮吝也。|相遇在角尖，在上而窮，有困窘。

乃亂乃萃，其志亂也。|心亂而亂聚，因心志紛亂。
引吉无咎，中未變也。|被引而聚吉無過，因中正之德未變。
往无咎，上巽也。|前往無過，因在上者謙遜接納。
大吉无咎，位不當也。|要大吉才無過，因位不當。
萃有位，志未光也。|聚而居尊位，但心志尚未光大。
齎咨涕洟，未安上也。|嗟嘆流淚，因不安於上位。

允升大吉，上合志也。|被信任而升大吉，與上位者志合。
九二之孚，有喜也。|九二的誠信，有喜慶。
升虛邑，无所疑也。|升入空城，無所疑慮。
王用亨于岐山，順事也。|君王祭祀岐山，是順理之事。
貞吉升階，大得志也。|守正吉步步高升，大得其志。
冥升在上，消不富也。|盲目上升而居上位，會消耗而不富有。

入于幽谷，幽不明也。|陷入幽谷，昏暗不明。
困于酒食，中有慶也。|困於酒食，因居中而有福慶。
據于蒺藜，乘剛也。入于其宮，不見其妻，不祥也。|倚在蒺藜上，因凌駕陽剛；回家不見妻，是不祥之兆。
來徐徐，志在下也。雖不當位，有與也。|來得緩慢，志在下方；雖不當位，但有應與。
劓刖，志未得也。乃徐有說，以中直也。利用祭祀，受福也。|割鼻斷足，志向未得；慢慢有喜悅，因中正正直；宜祭祀，將受福。
困于葛藟，未當也。動悔有悔，吉行也。|困於葛藤，因處位不當；動而知悔，行動則吉。

井泥不食，下也。舊井无禽，時舍也。|井泥不能食，因在最下；舊井無禽，已被時代捨棄。
井谷射鮒，无與也。|井底只能射小魚，因無人相應。
井渫不食，行惻也。求王明，受福也。|井淨無人飲，行路之人也傷心；求君王英明，大家受福。
井甃无咎，脩井也。|修砌井壁無過，是在修治水井。
寒泉之食，中正也。|寒泉可飲，因為中正。
元吉在上，大成也。|大吉在上，井道大成。

鞏用黃牛，不可以有為也。|用黃牛皮綁牢，因不可有所作為。
巳日革之，行有嘉也。|時機成熟再變革，行動有嘉美之功。
革言三就，又何之矣。|變革之議已再三成熟，還要往哪裡去？
改命之吉，信志也。|改命之吉，因心志被人信服。
大人虎變，其文炳也。|大人如虎紋變化，文采炳然。
君子豹變，其文蔚也。小人革面，順以從君也。|君子如豹紋變化，文采繁盛；小人改變面貌，順從君上。

鼎顛趾，未悖也。利出否，以從貴也。|鼎倒覆，並未違理；宜倒出污穢，以追隨尊貴。
鼎有實，慎所之也。我仇有疾，終无尤也。|鼎中有實，要謹慎所往；對頭有疾，終無怨尤。
鼎耳革，失其義也。|鼎耳變形，失去其用處。
覆公餗，信如何也。|打翻王公美食，還有何信用可言？
鼎黃耳，中以為實也。|鼎配黃耳，以中德為實。
玉鉉在上，剛柔節也。|玉鉉在上，剛柔調和有節。

震來虩虩，恐致福也。笑言啞啞，後有則也。|雷來而恐懼，恐懼能帶來福；談笑自若，之後有法則可循。
震來厲，乘剛也。|雷來危險，因凌駕陽剛。
震蘇蘇，位不當也。|惶惶不安，因位不當。
震遂泥，未光也。|陷入泥中，未能光大。
震往來厲，危行也。其事在中，大无喪也。|往來皆危，是危中而行；所做之事合乎中道，大無損失。
震索索，中未得也。雖凶无咎，畏鄰戒也。|驚恐顫抖，因未得中道；雖凶而無過，因見鄰人遭災而知戒備。

艮其趾，未失正也。|止於腳趾，未失正道。
不拯其隨，未退聽也。|不能救所隨之人，因對方不肯退而聽從。
艮其限，危薰心也。|止於腰部，危險令人焦心。
艮其身，止諸躬也。|止住身體，是止於自身。
艮其輔，以中正也。|管住口頰，因為中正。
敦艮之吉，以厚終也。|敦厚知止之吉，以厚德善終。

小子之厲，義无咎也。|年輕人之危，按理無過。
飲食衎衎，不素飽也。|飲食和樂，不是白吃白喝。

function build(vals){

 const zb=bits.slice();mov.forEach(i=>zb[i]^=1);

}

// 朱熹〈考變占〉
function zhan(r){
 const B=r.ben,Z=r.zhi,n=r.mov.length,b=r.bits;
 const yi=(h,i,bits,main)=>({lab:`${h.n}・${yaoName(i,bits[i])}`,t:h.y[i].t,k:h.y[i].k,xl:'小象',x:h.y[i].x,main});
 const gua=(h,tag)=>({lab:`${h.n}・卦辭${tag?`（${tag}）`:''}`,t:h.c,k:h.k,xl:'大象',x:h.dx});
 const st=[0,1,2,3,4,5].filter(i=>!r.mov.includes(i));
 switch(n){
  case 0:return{rule:'六爻皆不變，則占本卦彖辭。',items:[gua(B)]};
  case 1:return{rule:'一爻變，則以本卦變爻辭占。',items:[yi(B,r.mov[0],b)]};
  case 2:return{rule:'二爻變，則以本卦二變爻辭占，仍以上爻為主。',items:[yi(B,r.mov[1],b,1),yi(B,r.mov[0],b)]};
  case 3:return{rule:'三爻變，則占本卦及之卦之彖辭，即以本卦為貞，之卦為悔。',items:[gua(B,'本卦・貞'),gua(Z,'之卦・悔')],note:'朱子又以卦變之序分「前十卦主貞，後十卦主悔」，此處二辭並列，宜合參。'};
  case 4:return{rule:'四爻變，則以之卦二不變爻占，仍以下爻為主。',items:[yi(Z,st[0],r.zhiBits,1),yi(Z,st[1],r.zhiBits)]};
  case 5:return{rule:'五爻變，則以之卦不變爻占。',items:[yi(Z,st[0],r.zhiBits)]};
  default:{const Y=YONG[B.n];return{rule:'六爻變，則乾坤占二用，餘卦占之卦彖辭。',items:[Y?{lab:`${B.n}・${Y.p}`,t:Y.t,k:Y.k,xl:'小象',x:Y.x}:gua(Z,'之卦')]}}
 }
}

function svg(b,mov){
 const W=180,lh=16,gap=14,H=6*lh+5*gap;let s='';
 for(let i=0;i<6;i++){
  const y=H-lh-i*(lh+gap);const c=mov.includes(i)?'var(--zhu)':'currentColor';const st=`style="animation-delay:${i*60}ms"`;
  s+=b[i]?`<rect class="ln" ${st} x="0" y="${y}" width="${W}" height="${lh}" fill="${c}"/>`:`<g class="ln" ${st}><rect x="0" y="${y}" width="${W*0.42}" height="${lh}" fill="${c}"/><rect x="${W*0.58}" y="${y}" width="${W*0.42}" height="${lh}" fill="${c}"/></g>`;
 }
 return`<svg viewBox="-4 -4 ${W+8} ${H+8}" role="img" aria-label="卦畫">${s}</svg>`;
}

function lunar(d,late){
 const dd=new Date(d);const h=dd.getHours();
 if(late&&h===23)dd.setDate(dd.getDate()+1);
 const p=new Intl.DateTimeFormat('en-u-ca-chinese',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(dd);
 const g=t=>(p.find(x=>x.type===t)||{}).value||'';
 const y=parseInt(g('relatedYear')||g('year'),10);
 const mraw=g('month');
 return{y,m:parseInt(mraw,10),leap:/bis|閏/.test(mraw),day:parseInt(g('day'),10),yz:md(y-3,12),hz:Math.floor((h+1)/2)%12+1};
}
function castTime(){

 const L=lunar(v,$('late').checked);
 const s1=L.yz+L.m+L.day,s2=s1+L.hz;
 const up=md(s1,8),lo=md(s2,8),mv=md(s2,6);
 finish({mode:'time',vals:valsFrom(up,lo,mv),src:`時間 ${v.replace('T',' ')}`,
  calc:`農曆${ZHI[L.yz-1]}年（${L.yz}）${L.leap?'閏':''}${cnNum(L.m)}月（${L.m}）${cnNum(L.day)}日（${L.day}）${ZHI[L.hz-1]}時（${L.hz}）<br>上卦：${L.yz}+${L.m}+${L.day}=<b>${s1}</b>，÷8 餘 ${s1%8} → <b>${TRI[up][0]}</b>　下卦：${s1}+${L.hz}=<b>${s2}</b>，÷8 餘 ${s2%8} → <b>${TRI[lo][0]}</b>　動爻：${s2}÷6 餘 ${s2%6} → <b>第${mv}爻</b>${L.leap?'<br>閏月以本月數計。':''}`});
}

const S={lv:[],li:0,ci:0,av:49,log:[]};
function sRender(){
 const done=S.lv.length===6,dc=S.li*3+S.ci;
 $('dots').innerHTML=Array.from({length:18},(_,i)=>`<span class="dot ${done||i<dc?'f':i===dc?'c':''}"></span>`).join('');
 $('slbl').textContent=done?'十八變完成':`第${OR[S.li]}爻・${CL[S.ci]}`;
 $('savail').innerHTML=done?'卦已成，結果見下方。':`現有蓍策 <b>${S.av}</b> 枚，分置左右手。`;
 $('fs').hidden=done;$('rndS').hidden=done;$('autoS').hidden=done;
 $('plines').innerHTML=[5,4,3,2,1,0].map(i=>{
  if(i>=S.lv.length)return`<li><span>${POS[i]}爻</span><span class="bar e"><i style="width:100%;height:1px;align-self:center"></i></span><span class="sm" style="margin:0">—</span></li>`;
  const v=S.lv[i],m=v===6||v===9;
  return`<li class="${m?'mv':''}"><span>${POS[i]}爻</span><span class="bar">${v%2?'<i style="width:100%"></i>':'<i style="width:42%"></i><i style="width:42%"></i>'}</span><span>${LN[v]}</span></li>`}).join('');
 autoR();
}
function autoR(){const L=parseInt($('Li').value,10);$('Rd').textContent=Number.isInteger(L)&&L>=1&&L<=S.av-2?S.av-L:'—'}
function step(L){
 if(S.lv.length===6)return false;
 if(!Number.isInteger(L)||L<1||L>S.av-2){$('serr').textContent=`左手蓍策須介於 1 至 ${S.av-2}（右手至少須留二策以掛一）。`;return false}
 $('serr').textContent='';
 const R=S.av-L;let lr=L%4||4,rr=(R-1)%4||4;const sa=1+lr+rr,rem=S.av-sa;
 S.log.push({li:S.li,ci:S.ci,L,R,lr,rr,sa,rem});
 let h=`第${OR[S.li]}爻・${CL[S.ci]}：左手 ${L} 揲四餘 <b>${lr}</b>；右手 ${R} 掛一後 ${R-1} 揲四餘 <b>${rr}</b>；掛扐 1+${lr}+${rr}=<b>${sa}</b>，餘策 <b>${rem}</b>`;
 S.av=rem;
 if(S.ci===2){const v=SV[rem];S.lv.push(v);h+=`<br>${rem}÷4=${rem/4} → <b>${LN[v]}</b>（${v===9||v===6?'動爻':'靜爻'}）`;S.li++;S.ci=0;S.av=49}else S.ci++;
 $('sres').innerHTML=h;$('Li').value='';
 if(S.lv.length===6){
  finish({mode:'shi',vals:S.lv.slice(),log:S.log.slice(),src:`蓍草 ${S.lv.join('')}`,
   calc:`蓍草十八變，六爻（初→上）：${S.lv.map((v,i)=>`${POS[i]}${LN[v]}`).join('、')}`});
 }
 sRender();return true;
}
function rndL(){const a=new Uint32Array(2);crypto.getRandomValues(a);const n=S.av-2;return Math.min(n,Math.max(1,Math.round(((a[0]%n)+(a[1]%n))/2)+1))}
function logTable(log){
 return`<table class="num"><thead><tr><th>爻</th><th>變</th><th>左手</th><th>右手</th><th>左餘</th><th>右餘</th><th>掛扐</th><th>餘策</th><th>爻象</th></tr></thead><tbody>`+
 log.map(r=>`<tr><td>${POS[r.li]}爻</td><td>${CL[r.ci]}</td><td>${r.L}</td><td>${r.R}</td><td>${r.lr}</td><td>${r.rr}</td><td>${r.sa}</td><td>${r.rem}</td><td>${r.ci===2?LN[SV[r.rem]]:''}</td></tr>`).join('')+`</tbody></table>`;
}
function sReset(){Object.assign(S,{lv:[],li:0,ci:0,av:49,log:[]});$('sres').innerHTML='';$('serr').textContent='';sRender()}

// 紀錄
const KEY='yizhan-hist',OLD='meihua-hist';
function load(){
 try{let h=JSON.parse(localStorage.getItem(KEY)||'null');
  if(!h){h=JSON.parse(localStorage.getItem(OLD)||'[]').filter(x=>x.up).map(x=>({q:x.q,src:x.src,mode:x.mode==='time'?'time':'three',at:x.at,calc:x.calc,vals:valsFrom(x.up,x.lo,x.mv)}))}
  return Array.isArray(h)?h:[]}catch(e){return[]}
}
function save(r){const h=load();h.unshift({q:r.q,src:r.src,mode:r.mode,at:r.at,calc:r.calc,vals:r.vals,log:r.log});try{localStorage.setItem(KEY,JSON.stringify(h.slice(0,50)))}catch(e){}showHist()}
function showHist(){
 const h=load();
 $('hist').innerHTML=h.length?h.map((x,i)=>{const b=build(x.vals);return`<li><button type="button" data-i="${i}">${b.ben.n}${b.mov.length?` 之 ${b.zhi.n}`:''}</button><span>${x.q?esc(x.q)+'・':''}${esc(x.src)}</span><span class="d">${new Date(x.at).toLocaleString('zh-TW',{hour12:false})}</span></li>`}).join(''):'<li class="empty">尚無紀錄。</li>';
}
$('hist').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const x=load()[+b.dataset.i];const r=Object.assign({},x,build(x.vals));render(r);window.scrollTo({top:$('calc').getBoundingClientRect().top+window.scrollY-20,behavior:'smooth'})});
$('clr').addEventListener('click',()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(OLD)}catch(e){}showHist()});

// 介面
const now=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
$('dt').value=now();
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
 mode=b.dataset.m;
 document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
 document.querySelectorAll('[data-p]').forEach(p=>p.hidden=p.dataset.p!==mode);
 err('');
}));
$('f3').addEventListener('submit',e=>{e.preventDefault();castThree()});
$('ft').addEventListener('submit',e=>{e.preventDefault();castTime()});
$('nowT').addEventListener('click',()=>{$('dt').value=now();castTime()});
$('rnd3').addEventListener('click',()=>{const a=new Uint32Array(3);crypto.getRandomValues(a);$('a3').value=a[0]%900+100;$('b3').value=a[1]%900+100;$('c3').value=a[2]%900+100;castThree()});
$('fs').addEventListener('submit',e=>{e.preventDefault();step(parseInt($('Li').value,10))});
$('Li').addEventListener('input',autoR);
$('rndS').addEventListener('click',()=>step(rndL()));
$('autoS').addEventListener('click',()=>{while(S.lv.length<6)step(rndL())});
$('rstS').addEventListener('click',sReset);
$('copy').addEventListener('click',async()=>{if(!last)return;try{await navigator.clipboard.writeText(text(last));$('toast').textContent='已複製'}catch(e){$('toast').textContent='無法複製'}setTimeout(()=>$('toast').textContent='',2000)});
sRender();showHist();castThree(true);
}
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
